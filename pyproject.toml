[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "StaX"
dynamic = ["version"]
description = "Open-source advanced solution for mass production stock footage management"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ffpyplayer>=4.5.3",
    "fileseq>=1.15.0",
    "flask>=3.1.3",
    "imagehash>=4.3.2",
    "numpy>=2.0.2",
    # EP7 AI discovery: local CPU inference runtime for the CLIP ONNX model
    # (~15 MB prebuilt Win+Linux wheel, no PyTorch). The model itself is
    # downloaded at runtime by tools/download_clip_model.py, not pip-installed.
    # onnxruntime 1.20+ dropped Python 3.9 wheels (cp310+ only); StaX targets
    # 3.9, so cap it there (1.19.2 is the last release with cp39 wheels) while
    # letting 3.10+ environments use the current release.
    "onnxruntime>=1.17.0,<1.20; python_full_version < '3.10'",
    "onnxruntime>=1.17.0; python_full_version >= '3.10'",
    "opencv-python>=4.13.0.92",
    "pillow>=11.3.0",
    "pyside2>=5.15.2.1",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    # EP7 AI discovery: CLIP's exact BPE token pattern needs \p{L}/\p{N}
    # unicode classes, which stdlib `re` (Py3.9) lacks. Used by clip_tokenizer.
    "regex>=2023.0.0",
]

[project.optional-dependencies]
build = [
    "cx-freeze>=7.2",
]

dev = [
    "pytest>=7",
    # pytest-qt 4.3+ dropped PySide2; StaX is PySide2 (Qt5), so pin to the
    # last PySide2-supporting line or the gui tier's qtbot fails to load.
    "pytest-qt<4.3",
    "pytest-mock",
    "pytest-cov",
    "flask",
]

[tool.hatch.version]
path = "src/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]
